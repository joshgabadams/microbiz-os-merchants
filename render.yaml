databases:
  - name: microbiz-os-db
    plan: free
    databaseName: microbiz_os
    user: microbiz_os

services:
  - type: web
    name: microbiz-os
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: MicroBiz OS
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: microbiz-os
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: microbiz-os-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: microbiz-os-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: microbiz-os-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: microbiz-os-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: microbiz-os-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: "false"
      - key: FINERACT_URL
        sync: false
      - key: FINERACT_USER
        sync: false
      - key: FINERACT_PASSWORD
        sync: false
      - key: FINERACT_TENANT
        sync: false
